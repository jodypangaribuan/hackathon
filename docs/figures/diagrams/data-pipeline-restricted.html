<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Data Pipeline &amp; Restricted Data</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 1040px; }
    .tier-title { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
    .bucket { fill: var(--muted); font: 400 9px var(--mono); text-anchor: middle; }
    .field-label { fill: var(--ink); font: 600 11px var(--sans); }
    .field-value { fill: var(--muted); font: 400 9px var(--mono); }
    .focal-text { fill: var(--accent); }
    .example-label { fill: var(--soft); font: 500 8px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
    .example-value { fill: var(--muted); font: 400 9px var(--mono); }
    .arc-label { font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; text-anchor: middle; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Medallion · Diagram Design</p>
    <h1>Lapisan data dan kebijakan akses</h1>

    <svg viewBox="0 0 1040 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-title medallion-desc">
      <title id="medallion-title">Lapisan data SIPATURE dari mentah hingga agregat aman</title>
      <desc id="medallion-desc">Lima lapisan data mengalir dari CSV mentah yang memuat identitas reviewer, melalui pembersihan, anotasi, dan agregasi, menuju bundle agregat aman yang dipublikasikan tanpa identitas reviewer.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <clipPath id="clip-raw"><rect x="16" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-clean"><rect x="204" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-label"><rect x="392" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-agg"><rect x="580" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-safe"><rect x="768" y="80" width="172" height="380" rx="6"/></clipPath>
      </defs>
      <rect width="1040" height="548" fill="#f5f5f5"/>

      <!-- Promotion arcs -->
      <path d="M102 80 C102 0 290 0 290 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M290 80 C290 0 478 0 478 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M478 80 C478 0 666 0 666 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M666 80 C666 0 854 0 854 80" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="196" y="50" class="arc-label" fill="#4f5d75">CLEAN + ER</text>
      <text x="384" y="50" class="arc-label" fill="#4f5d75">ANNOTATE</text>
      <text x="572" y="50" class="arc-label" fill="#4f5d75">INFER + AGG</text>
      <text x="760" y="50" class="arc-label" fill="#eb6c36">PRIVACY GATE</text>

      <!-- Raw -->
      <rect x="16" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="16" y="80" width="172" height="50" fill="rgba(79,93,117,0.10)" clip-path="url(#clip-raw)"/>
      <rect x="16" y="80" width="172" height="380" rx="6" fill="none" stroke="#4f5d75"/>
      <text x="102" y="106" class="tier-title">Raw</text>
      <text x="102" y="144" class="bucket">wisata-v2 · resto-hotel</text>
      <text x="32" y="180" class="field-label">Format</text>
      <text x="32" y="196" class="field-value">CSV · 22.302 record</text>
      <text x="32" y="220" class="field-label">Identitas</text>
      <text x="32" y="236" class="field-value">reviewer ADA</text>
      <text x="32" y="260" class="field-label">Akses</text>
      <text x="32" y="276" class="field-value">restricted</text>
      <text x="32" y="360" class="example-label">Contoh</text>
      <text x="32" y="376" class="example-value">reviewer-id, name</text>
      <text x="32" y="390" class="example-value">review-text</text>

      <!-- Clean -->
      <rect x="204" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="204" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-clean)"/>
      <rect x="204" y="80" width="172" height="380" rx="6" fill="none" stroke="#2d3142"/>
      <text x="290" y="106" class="tier-title">Clean &amp; Linked</text>
      <text x="290" y="144" class="bucket">canonical_reviews</text>
      <text x="220" y="180" class="field-label">Format</text>
      <text x="220" y="196" class="field-value">Parquet · 22.169</text>
      <text x="220" y="220" class="field-label">Identitas</text>
      <text x="220" y="236" class="field-value">review_id hash</text>
      <text x="220" y="260" class="field-label">Akses</text>
      <text x="220" y="276" class="field-value">restricted</text>
      <text x="220" y="360" class="example-label">Contoh</text>
      <text x="220" y="376" class="example-value">388 canonical ID</text>
      <text x="220" y="390" class="example-value">322 anchor + 66 unresolved</text>

      <!-- Label -->
      <rect x="392" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="392" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-label)"/>
      <rect x="392" y="80" width="172" height="380" rx="6" fill="none" stroke="#2d3142"/>
      <text x="478" y="106" class="tier-title">Label</text>
      <text x="478" y="144" class="bucket">silver + gold.jsonl</text>
      <text x="408" y="180" class="field-label">Format</text>
      <text x="408" y="196" class="field-value">JSONL · 1.320</text>
      <text x="408" y="220" class="field-label">Identitas</text>
      <text x="408" y="236" class="field-value">teks review</text>
      <text x="408" y="260" class="field-label">Akses</text>
      <text x="408" y="276" class="field-value">restricted</text>
      <text x="408" y="360" class="example-label">Contoh</text>
      <text x="408" y="376" class="example-value">gold Jaccard 0.97</text>
      <text x="408" y="390" class="example-value">3 anotator + adjudikasi</text>

      <!-- Aggregate -->
      <rect x="580" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="580" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-agg)"/>
      <rect x="580" y="80" width="172" height="380" rx="6" fill="none" stroke="#2d3142"/>
      <text x="666" y="106" class="tier-title">Aggregate</text>
      <text x="666" y="144" class="bucket">signals + evidence</text>
      <text x="596" y="180" class="field-label">Format</text>
      <text x="596" y="196" class="field-value">Parquet · 1.682</text>
      <text x="596" y="220" class="field-label">Identitas</text>
      <text x="596" y="236" class="field-value">evidence verbatim</text>
      <text x="596" y="260" class="field-label">Akses</text>
      <text x="596" y="276" class="field-value">restricted</text>
      <text x="596" y="360" class="example-label">Contoh</text>
      <text x="596" y="376" class="example-value">source_file + row</text>
      <text x="596" y="390" class="example-value">9.785 prediksi aspek</text>

      <!-- Safe product (focal) -->
      <rect x="768" y="80" width="172" height="380" rx="6" fill="rgba(235,108,54,0.07)"/>
      <rect x="768" y="80" width="172" height="50" fill="rgba(235,108,54,0.14)" clip-path="url(#clip-safe)"/>
      <rect x="768" y="80" width="172" height="380" rx="6" fill="none" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="854" y="106" class="tier-title">Safe Product</text>
      <text x="854" y="144" class="bucket focal-text">app bundle</text>
      <text x="784" y="180" class="field-label">Format</text>
      <text x="784" y="196" class="field-value">JSON · 103 dest</text>
      <text x="784" y="220" class="field-label">Identitas</text>
      <text x="784" y="236" class="field-value focal-text">TIDAK ADA</text>
      <text x="784" y="260" class="field-label">Akses</text>
      <text x="784" y="276" class="field-value focal-text">published</text>
      <text x="784" y="360" class="example-label">Contoh</text>
      <text x="784" y="376" class="example-value focal-text">103 destinasi actionable</text>
      <text x="784" y="390" class="example-value focal-text">210 isu · tanpa reviewer</text>

      <!-- Write-method paths -->
      <rect x="16" y="476" width="460" height="56" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <rect x="24" y="482" width="80" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="491" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BATCH PATH</text>
      <text x="96" y="506" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">sipature-ml infer-corpus</text>
      <text x="96" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">12.234 review · deterministik · hash-verified</text>
      <rect x="492" y="476" width="460" height="56" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <rect x="500" y="482" width="80" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="540" y="491" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE PATH</text>
      <text x="572" y="506" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">/predict-review · FastAPI</text>
      <text x="572" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">p50 2.1 ms · CPU-only · offline</text>
    </svg>
  </main>
</body>
</html>
