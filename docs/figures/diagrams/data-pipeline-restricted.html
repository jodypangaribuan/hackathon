<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Data Pipeline &amp; Restricted Data</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame {
      width: 100%;
      max-width: 1100px;
    }
    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 1.5rem;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 960px;
    }
    .tier-title {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 600;
      text-anchor: middle;
    }
    .tier-num {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-anchor: middle;
    }
    .stat-badge-text {
      font-family: var(--mono);
      font-size: 8.5px;
      fill: var(--muted);
      text-anchor: middle;
    }
    .field-label {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 9.5px;
      font-weight: 600;
    }
    .field-val {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 8.5px;
    }
    .field-focal {
      fill: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
    }
    .arc-label {
      font-family: var(--mono);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 9px;
      text-anchor: middle;
    }
    .path-title {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
    }
    .path-sub {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 8.5px;
    }
    .badge-text {
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Medallion · Diagram Design</p>
    <h1>Lima lapisan data — dari mentah (restricted) ke agregat aman (published)</h1>

    <svg viewBox="0 0 1040 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-title medallion-desc">
      <title id="medallion-title">Lapisan data SIPATURE dari mentah hingga agregat aman</title>
      <desc id="medallion-desc">Lima lapisan data mengalir dari CSV mentah yang memuat identitas reviewer, melalui pembersihan, anotasi, dan agregasi, menuju bundle agregat aman yang dipublikasikan tanpa identitas reviewer.</desc>
      <defs>
        <!-- Arrowhead Markers -->
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <!-- Dot Pattern Background -->
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <!-- Card Header Clips -->
        <clipPath id="clip-raw"><rect x="16" y="76" width="172" height="316" rx="6"/></clipPath>
        <clipPath id="clip-clean"><rect x="204" y="76" width="172" height="316" rx="6"/></clipPath>
        <clipPath id="clip-label"><rect x="392" y="76" width="172" height="316" rx="6"/></clipPath>
        <clipPath id="clip-agg"><rect x="580" y="76" width="172" height="316" rx="6"/></clipPath>
        <clipPath id="clip-safe"><rect x="768" y="76" width="172" height="316" rx="6"/></clipPath>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

      <!-- ================= PROMOTION ARCS ================= -->
      <!-- 0 -> 1: Clean & ER -->
      <path d="M 102 76 C 102 12 290 12 290 76" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="156" y="24" width="80" height="16" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.20)" stroke-width="0.8"/>
      <text x="196" y="35.5" class="arc-label" fill="#4f5d75">CLEAN + ER</text>

      <!-- 1 -> 2: Annotate -->
      <path d="M 290 76 C 290 12 478 12 478 76" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="344" y="24" width="80" height="16" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.20)" stroke-width="0.8"/>
      <text x="384" y="35.5" class="arc-label" fill="#4f5d75">ANNOTATE</text>

      <!-- 2 -> 3: Infer + Agg -->
      <path d="M 478 76 C 478 12 666 12 666 76" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="532" y="24" width="80" height="16" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.20)" stroke-width="0.8"/>
      <text x="572" y="35.5" class="arc-label" fill="#4f5d75">INFER + AGG</text>

      <!-- 3 -> 4: Privacy Gate (Focal) -->
      <path d="M 666 76 C 666 12 854 12 854 76" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="712" y="22" width="96" height="20" rx="3" fill="#f5f5f5" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
      <text x="760" y="35.5" class="arc-label" fill="#eb6c36">🛡️ PRIVACY GATE</text>


      <!-- ================= PRIVACY BOUNDARY DIVIDER ================= -->
      <line x1="760" y1="56" x2="760" y2="400" stroke="rgba(235,108,54,0.30)" stroke-width="1.2" stroke-dasharray="4,4"/>


      <!-- ================= TIER 1: RAW DATA ================= -->
      <rect x="16" y="76" width="172" height="316" rx="6" fill="#fff"/>
      <rect x="16" y="76" width="172" height="46" fill="rgba(79,93,117,0.08)" clip-path="url(#clip-raw)"/>
      <rect x="16" y="76" width="172" height="316" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
      
      <text x="102" y="93" class="tier-num">01 · LANDING</text>
      <text x="102" y="110" class="tier-title">Raw CSV</text>
      
      <rect x="36" y="132" width="132" height="18" rx="2" fill="rgba(79,93,117,0.08)"/>
      <text x="102" y="144" class="stat-badge-text">22.302 record mentah</text>

      <line x1="32" y1="162" x2="172" y2="162" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      
      <text x="32" y="180" class="field-label">Identitas Reviewer</text>

      <line x1="32" y1="214" x2="172" y2="214" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="70" y="251" class="badge-text" fill="#4f5d75" text-anchor="middle">RESTRICTED</text>

      <line x1="32" y1="268" x2="172" y2="268" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="32" y="286" class="field-label">Format Data</text>
      <text x="32" y="302" class="field-val">CSV (wisata, resto-hotel)</text>

      <text x="32" y="336" class="field-label">Lingkup Pengguna</text>
      <text x="32" y="352" class="field-val">Tim Data/ML (Audit)</text>


      <!-- ================= TIER 2: CLEAN & LINKED ================= -->
      <rect x="204" y="76" width="172" height="316" rx="6" fill="#fff"/>
      <rect x="204" y="76" width="172" height="46" fill="rgba(45,49,66,0.05)" clip-path="url(#clip-clean)"/>
      <rect x="204" y="76" width="172" height="316" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      
      <text x="290" y="93" class="tier-num">02 · STAGING</text>
      <text x="290" y="110" class="tier-title">Clean &amp; Linked</text>
      
      <rect x="224" y="132" width="132" height="18" rx="2" fill="rgba(45,49,66,0.05)"/>
      <text x="290" y="144" class="stat-badge-text">22.169 review · 388 ID</text>

      <line x1="220" y1="162" x2="360" y2="162" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      
      <text x="220" y="180" class="field-label">Identitas Reviewer</text>
      <text x="220" y="196" class="field-val">review_id (Hash SHA-256)</text>

      <line x1="220" y1="214" x2="360" y2="214" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="220" y="232" class="field-label">Kebijakan Akses</text>
      <rect x="220" y="240" width="76" height="15" rx="2" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="0.6"/>
      <text x="258" y="251" class="badge-text" fill="#4f5d75" text-anchor="middle">RESTRICTED</text>

      <line x1="220" y1="268" x2="360" y2="268" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="220" y="286" class="field-label">Format Data</text>
      <text x="220" y="302" class="field-val">Parquet / Canonical JSONL</text>

      <text x="220" y="336" class="field-label">Lingkup Pengguna</text>
      <text x="220" y="352" class="field-val">Tim Data/ML (Audit)</text>


      <!-- ================= TIER 3: ANNOTATION ================= -->
      <rect x="392" y="76" width="172" height="316" rx="6" fill="#fff"/>
      <rect x="392" y="76" width="172" height="46" fill="rgba(45,49,66,0.05)" clip-path="url(#clip-label)"/>
      <rect x="392" y="76" width="172" height="316" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      
      <text x="478" y="93" class="tier-num">03 · CURATED</text>
      <text x="478" y="110" class="tier-title">Annotation Base</text>
      
      <rect x="412" y="132" width="132" height="18" rx="2" fill="rgba(45,49,66,0.05)"/>
      <text x="478" y="144" class="stat-badge-text">1.320 anotasi (Gold/Silver)</text>

      <line x1="408" y1="162" x2="548" y2="162" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      
      <text x="408" y="180" class="field-label">Identitas Reviewer</text>
      <text x="408" y="196" class="field-val">Teks Ulasan (No Profil)</text>

      <line x1="408" y1="214" x2="548" y2="214" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="408" y="232" class="field-label">Kebijakan Akses</text>
      <rect x="408" y="240" width="76" height="15" rx="2" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="0.6"/>
      <text x="446" y="251" class="badge-text" fill="#4f5d75" text-anchor="middle">RESTRICTED</text>

      <line x1="408" y1="268" x2="548" y2="268" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="408" y="286" class="field-label">Format Data</text>
      <text x="408" y="302" class="field-val">JSONL (14 Aspek &amp; Polaritas)</text>

      <text x="408" y="336" class="field-label">Lingkup Pengguna</text>
      <text x="408" y="352" class="field-val">Tim Data/ML (Training)</text>


      <!-- ================= TIER 4: AGGREGATE ================= -->
      <rect x="580" y="76" width="172" height="316" rx="6" fill="#fff"/>
      <rect x="580" y="76" width="172" height="46" fill="rgba(45,49,66,0.05)" clip-path="url(#clip-agg)"/>
      <rect x="580" y="76" width="172" height="316" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
      
      <text x="666" y="93" class="tier-num">04 · ROLLUP</text>
      <text x="666" y="110" class="tier-title">Aggregate Store</text>
      
      <rect x="600" y="132" width="132" height="18" rx="2" fill="rgba(45,49,66,0.05)"/>
      <text x="666" y="144" class="stat-badge-text">1.682 sinyal terdeteksi</text>

      <line x1="596" y1="162" x2="736" y2="162" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      
      <text x="596" y="180" class="field-label">Identitas Reviewer</text>
      <text x="596" y="196" class="field-val">Evidence Verbatim (Audit)</text>

      <line x1="596" y1="214" x2="736" y2="214" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="596" y="232" class="field-label">Kebijakan Akses</text>
      <rect x="596" y="240" width="76" height="15" rx="2" fill="rgba(79,93,117,0.12)" stroke="#4f5d75" stroke-width="0.6"/>
      <text x="634" y="251" class="badge-text" fill="#4f5d75" text-anchor="middle">RESTRICTED</text>

      <line x1="596" y1="268" x2="736" y2="268" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="596" y="286" class="field-label">Format Data</text>
      <text x="596" y="302" class="field-val">PostgreSQL 16 / Parquet</text>

      <text x="596" y="336" class="field-label">Lingkup Pengguna</text>
      <text x="596" y="352" class="field-val">Tim Data/ML &amp; Engine</text>


      <!-- ================= TIER 5: SAFE PRODUCT (FOCAL ★) ================= -->
      <rect x="768" y="76" width="172" height="316" rx="6" fill="rgba(235,108,54,0.06)"/>
      <rect x="768" y="76" width="172" height="46" fill="rgba(235,108,54,0.14)" clip-path="url(#clip-safe)"/>
      <rect x="768" y="76" width="172" height="316" rx="6" fill="none" stroke="#eb6c36" stroke-width="1.6"/>
      
      <text x="854" y="93" class="tier-num" fill="#eb6c36" font-weight="600">05 · PUBLISHED ★</text>
      <text x="854" y="110" class="tier-title" fill="#eb6c36">Safe Product</text>
      
      <rect x="788" y="132" width="132" height="18" rx="2" fill="rgba(235,108,54,0.12)"/>
      <text x="854" y="144" class="stat-badge-text" fill="#eb6c36" font-weight="600">103 dest · 210 isu</text>

      <line x1="784" y1="162" x2="924" y2="162" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>

      <line x1="784" y1="214" x2="924" y2="214" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>

      <text x="822" y="251" class="badge-text" fill="#eb6c36" font-weight="600" text-anchor="middle">PUBLISHED</text>

      <line x1="784" y1="268" x2="924" y2="268" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>

      <text x="784" y="352" class="field-focal">Publik, Juri &amp; Pengelola</text>


      <!-- ================= BOTTOM PATHS (INGESTION MODES) ================= -->
      <!-- Batch Path -->
      <rect x="16" y="416" width="460" height="52" rx="6" fill="#fff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>

      <!-- Live Path -->

    </svg>
  </main>
</body>
</html>
