<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Corong Pembersihan Data & Ekstraksi Sinyal</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame {
      width: 100%;
      max-width: 1020px;
    }
    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 1.5rem;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 920px;
    }
    .layer-title {
      font-family: var(--sans);
      font-size: 13.5px;
      font-weight: 600;
      fill: var(--ink);
    }
    .layer-sub {
      font-family: var(--mono);
      font-size: 9px;
      fill: var(--muted);
    }
    .callout-title {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      fill: var(--ink);
    }
    .callout-desc {
      font-family: var(--mono);
      font-size: 8px;
      fill: var(--muted);
    }
    .focal-title {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      fill: var(--accent);
    }
    .focal-sub {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 500;
      fill: var(--accent);
    }
    .axis-label {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: var(--soft);
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data Funnel · Diagram Design</p>
    <h1>Corong penyaringan ulasan dan konversi sinyal operasional</h1>

    <svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fn-title fn-desc">
      <title id="fn-title">Corong Pembersihan Data SIPATURE</title>
      <desc id="fn-desc">Diagram corong penyaringan dari 22.302 ulasan mentah hingga menghasilkan 210 isu terverifikasi pada 103 destinasi.</desc>
      
      <defs>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

      <!-- Left Axis Guide -->
      <line x1="120" y1="40" x2="120" y2="410" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="110" y="50" class="axis-label" text-anchor="end">INPUT DATA</text>
      <text x="110" y="405" class="axis-label" text-anchor="end" fill="#eb6c36">AKSI NYATA</text>


      <!-- ================= LAYER 1: RAW INGESTION (w_top=560, w_bot=480, h=66) ================= -->
      <!-- Center cx = 480. Top: x=200..760, y=28. Bot: x=240..720, y=94. -->
      <polygon points="200,28 760,28 720,94 240,94" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="480" y="54" class="layer-title" text-anchor="middle">22.302 Ulasan Mentah</text>
      <text x="480" y="74" class="layer-sub" text-anchor="middle">wisata-v2 (12.691) + resto-hotel-v2 (9.611)</text>

      <!-- Side Callout Right: Eliminasi Data Rusak -->
      <line x1="740" y1="61" x2="800" y2="61" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="804" y="42" width="144" height="38" rx="4" fill="#fff" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="814" y="57" class="callout-title" fill="#c0392b">−133 Data Dieliminasi</text>
      <text x="814" y="70" class="callout-desc">89 duplikat + 44 baris null</text>


      <!-- ================= LAYER 2: CLEAN DATA (w_top=464, w_bot=390, h=66) ================= -->
      <!-- Center cx = 480. Top: x=248..712, y=104. Bot: x=285..675, y=170. -->
      <polygon points="248,104 712,104 675,170 285,170" fill="rgba(79,93,117,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="480" y="130" class="layer-title" text-anchor="middle">22.169 Ulasan Bersih (Parquet)</text>
      <text x="480" y="150" class="layer-sub" text-anchor="middle">Deduplikasi Hash SHA-256 &amp; Identitas Anonim</text>

      <!-- Side Callout Right: Modalitas Rating -->
      <line x1="694" y1="137" x2="800" y2="137" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="804" y="118" width="144" height="38" rx="4" fill="#fff" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="814" y="133" class="callout-title">9.935 Hanya Rating</text>
      <text x="814" y="146" class="callout-desc">Dialihkan ke bobot eksposur</text>


      <!-- ================= LAYER 3: TEXTUAL CORPUS (w_top=374, w_bot=304, h=66) ================= -->
      <!-- Center cx = 480. Top: x=293..667, y=180. Bot: x=328..632, y=246. -->
      <polygon points="293,180 667,180 632,246 328,246" fill="rgba(79,93,117,0.12)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="480" y="206" class="layer-title" text-anchor="middle">12.234 Ulasan Berteks (55,2%)</text>
      <text x="480" y="226" class="layer-sub" text-anchor="middle">Korpus Masukan Model Ekstraksi NLP</text>

      <!-- Side Callout Left: Entity Resolution -->
      <line x1="164" y1="213" x2="310" y2="213" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="20" y="194" width="144" height="38" rx="4" fill="#fff" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="30" y="209" class="callout-title">388 ID Kanonikal</text>
      <text x="30" y="222" class="callout-desc">322 anchor + 66 placeholder</text>


      <!-- ================= LAYER 4: DETECTED SIGNALS (w_top=288, w_bot=224, h=66) ================= -->
      <!-- Center cx = 480. Top: x=336..624, y=256. Bot: x=368..592, y=322. -->
      <polygon points="336,256 624,256 592,322 368,322" fill="rgba(45,49,66,0.10)" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="480" y="282" class="layer-title" text-anchor="middle">1.682 Sinyal Aspek Terdeteksi</text>
      <text x="480" y="302" class="layer-sub" text-anchor="middle">9.785 Prediksi Aspek &amp; Bukti Verbatim</text>

      <!-- Side Callout Right: Filter Validasi -->
      <line x1="608" y1="289" x2="800" y2="289" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="2 2"/>
      <rect x="804" y="270" width="144" height="38" rx="4" fill="#fff" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="814" y="285" class="callout-title">Validasi Sinyal</text>
      <text x="814" y="298" class="callout-desc">Bayesian smoothing &amp; support</text>


      <!-- ================= LAYER 5: APEX / FOCAL (w_top=208, w_bot=156, h=80) ================= -->
      <!-- Center cx = 480. Top: x=376..584, y=332. Bot: x=402..558, y=412. -->
      <polygon points="376,332 584,332 558,412 402,412" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="480" y="362" class="focal-title" text-anchor="middle">210 Isu Terverifikasi</text>
      <text x="480" y="382" class="focal-sub" text-anchor="middle">pada 103 Destinasi Wisata</text>
      <text x="480" y="398" class="axis-label" fill="#eb6c36" text-anchor="middle">★ HASIL OPERASIONAL</text>


      <!-- Bottom Footer -->
      <line x1="120" y1="444" x2="860" y2="444" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="480" y="464" class="layer-sub" text-anchor="middle">Rantai konversi data menyaring kebisingan 22 ribu ulasan menjadi 210 titik prioritas inspeksi nyata bagi pengelola.</text>
    </svg>
  </main>
</body>
</html>
