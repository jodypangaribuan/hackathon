<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Benchmark Gold-v1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Diagram Design</p>
    <h1>Deteksi aspek — silver vs gold-v1</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bar-title bar-desc">
      <title id="bar-title">Perbandingan Macro F1 deteksi aspek pada silver dan gold-v1</title>
      <desc id="bar-desc">Bar chart berpasangan: untuk Keyword, TF-IDF, dan IndoBERT, bar kiri adalah Macro F1 pada locked silver test, bar kanan pada human-gold gold-v1. TF-IDF sebagai model produksi ditandai aksen.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">MACRO F1</text>

      <!-- Gridlines -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="344" x2="960" y2="344" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="268" x2="960" y2="268" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="192" x2="960" y2="192" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="116" x2="960" y2="116" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>

      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Y ticks -->
      <text x="72" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>
      <text x="72" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="44"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>

      <!-- Keyword group (cx=240): silver 0.9768, gold 0.7056 -->
      <rect x="160" y="48"  width="64" height="372" fill="#f5f5f5"/>
      <rect x="160" y="48"  width="64" height="372" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="192" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.98</text>
      <rect x="240" y="152" width="64" height="268" fill="#f5f5f5"/>
      <rect x="240" y="152" width="64" height="268" fill="rgba(45,49,66,0.18)" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="144" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">.71</text>

      <!-- TF-IDF group (cx=520): silver 0.7201, gold 0.5777 (focal) -->
      <rect x="440" y="148" width="64" height="272" fill="#f5f5f5"/>
      <rect x="440" y="148" width="64" height="272" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="472" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.72</text>
      <rect x="520" y="200" width="64" height="220" fill="#f5f5f5"/>
      <rect x="520" y="200" width="64" height="220" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="552" y="192" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">.58</text>

      <!-- IndoBERT group (cx=800): silver 0.5247, gold 0.4254 -->
      <rect x="720" y="220" width="64" height="200" fill="#f5f5f5"/>
      <rect x="720" y="220" width="64" height="200" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="752" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.52</text>
      <rect x="800" y="260" width="64" height="160" fill="#f5f5f5"/>
      <rect x="800" y="260" width="64" height="160" fill="rgba(45,49,66,0.18)" stroke="#2d3142" stroke-width="1"/>
      <text x="832" y="252" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">.43</text>

      <!-- X labels -->
      <text x="240" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Keyword</text>
      <text x="240" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ceiling (sirkular)</text>
      <text x="520" y="444" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TF-IDF</text>
      <text x="520" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">produksi</text>
      <text x="800" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IndoBERT</text>
      <text x="800" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ditolak</text>

      <!-- Legend -->
      <line x1="40" y1="480" x2="960" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="512" width="16" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="64" y="521" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Silver (locked)</text>
      <rect x="200" y="512" width="16" height="10" rx="2" fill="rgba(45,49,66,0.18)" stroke="#2d3142" stroke-width="1"/>
      <text x="224" y="521" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gold-v1 (human)</text>
      <rect x="384" y="512" width="16" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="408" y="521" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Model produksi</text>
    </svg>
  </div>
</body>
</html>
