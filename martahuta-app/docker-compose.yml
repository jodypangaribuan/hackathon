# Deployment MARTAHUTA.
#
# Server ini ada di belakang NAT residensial (IndiHome) dan Docker berjalan rootless,
# sehingga port 80/443 tidak bisa di-bind dan port forwarding tidak tersedia.
# Karena itu trafik publik masuk lewat Cloudflare Tunnel — koneksi keluar (outbound),
# tanpa perlu membuka port apa pun di router.
#
#   internet -> Cloudflare edge -> cloudflared (outbound) -> nginx:80 -> web:3000
#
# Jalankan:
#   cp .env.example .env   # lalu isi TUNNEL_TOKEN dari dashboard Cloudflare
#   docker compose up -d --build
#
# Verifikasi lokal (tanpa lewat internet):
#   curl -H "Host: martahuta.jodypangaribuan.my.id" http://127.0.0.1:8080/api/health

services:
  web:
    build: .
    image: martahuta-app:demo
    container_name: martahuta-web
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: martahuta-nginx
    # Hanya dipublikasikan ke loopback untuk verifikasi lokal.
    # Trafik publik tidak lewat sini melainkan lewat cloudflared.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/martahuta.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Host: martahuta.jodypangaribuan.my.id", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: martahuta-cloudflared
    # --protocol http2 memaksa transport TCP/443. Default-nya QUIC (UDP/7844),
    # yang sering gagal di balik NAT rootless / ISP yang membatasi UDP.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN belum diisi - salin dari Cloudflare Zero Trust ke file .env}
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
