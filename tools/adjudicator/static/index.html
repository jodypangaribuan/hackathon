<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIPATURE Adjudicator</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --hairline: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #2a78d6; --good: #16a34a;
    --bad: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 16px;
           border-bottom: 1px solid var(--hairline); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--hairline);
           background: var(--panel2); color: var(--text); font-size: 13px; cursor: pointer; }
  header button:disabled { opacity: 0.45; cursor: not-allowed; }
  .progress { font-size: 13px; color: var(--muted); }
  .progress strong { color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }
  .sidebar { border-right: 1px solid var(--hairline); overflow-y: auto; background: var(--panel); }
  .sidebar .item { padding: 10px 14px; border-bottom: 1px solid var(--hairline); cursor: pointer; font-size: 13px; }
  .sidebar .item:hover { background: var(--panel2); }
  .sidebar .item.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .sidebar .item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .dot.done { background: var(--good); } .dot.pending { background: var(--warn); }
  .sidebar .item .snip { color: var(--muted); font-size: 12px; margin-top: 3px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { overflow-y: auto; padding: 20px; }
  .review-card { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .review-text { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
  .review-text span.word { cursor: pointer; border-radius: 3px; }
  .review-text span.word:hover { background: var(--accent); }
  .review-text span.word.hl { background: rgba(42,120,214,0.30); }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  h3 { font-size: 14px; margin: 22px 0 10px; }
  .anno-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .anno-card { border: 1px solid var(--hairline); border-radius: 8px; background: var(--panel2); padding: 10px 12px; position: relative; }
  .anno-card.active { border-color: var(--good); box-shadow: 0 0 0 2px rgba(22,163,74,0.35); }
  .anno-card.active .who::after { content: " ✓ terpakai"; color: var(--good); font-weight: 600; }
  .anno-card .who { font-size: 12px; font-weight: 700; color: #7dd3fc; margin-bottom: 6px; }
  .anno-card button { margin-top: 8px; padding: 4px 10px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--hairline); background: var(--panel); color: var(--text); cursor: pointer; }
  .anno-card button.used { background: var(--good); border-color: var(--good); color: white; }
  .chip { display: inline-block; margin: 2px 3px 2px 0; padding: 2px 8px; border-radius: 6px;
    font-size: 11.5px; background: var(--panel); border: 1px solid var(--hairline); }
  .chip .ev { color: var(--muted); font-size: 10.5px; display: block; margin-top: 2px; }
  .pol-positive { color: var(--good); } .pol-negative { color: var(--bad); } .pol-neutral { color: var(--muted); }
  .aspect-list { display: flex; flex-direction: column; gap: 8px; }
  .aspect-card { border: 1px solid var(--hairline); border-radius: 8px; background: var(--panel2); overflow: hidden; }
  .aspect-card.on { border-color: var(--accent); }
  .aspect-card.focus { box-shadow: 0 0 0 2px var(--good); border-color: var(--good); }
  .aspect-head { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; cursor: pointer; }
  .aspect-head input[type=checkbox] { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
  .aspect-head .name { font-size: 13.5px; font-weight: 600; }
  .aspect-head .def { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .aspect-body { padding: 0 12px 12px 38px; display: none; }
  .aspect-card.on .aspect-body { display: block; }
  .aspect-body .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 6px 12px; cursor: pointer; background: var(--panel2); color: var(--text); font-size: 12px; }
  .seg button.on { background: var(--accent); color: white; }
  .seg.polarity button[data-p="positive"].on { background: var(--good); }
  .seg.polarity button[data-p="negative"].on { background: var(--bad); }
  .seg.polarity button[data-p="neutral"].on { background: var(--muted); }
  .seg.sev button.on { background: var(--warn); }
  .aspect-body input { flex: 1; min-width: 180px; padding: 7px 10px; border-radius: 6px;
           border: 1px solid var(--hairline); background: var(--panel); color: var(--text); font-size: 12.5px; }
  .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 14px; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .dest-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--panel2);
    border: 1px solid var(--hairline); font-size: 12px; font-weight: 600; color: #7dd3fc; margin-right: 8px; }
  details.panduan { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px; }
  details.panduan summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details.panduan .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 12px; }
  details.panduan .card { background: var(--panel2); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; }
  details.panduan .card h4 { margin: 0 0 4px; font-size: 13px; }
  details.panduan .card p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  details.panduan .card .kw { color: #7dd3fc; font-size: 11px; margin-top: 4px; }
  details.panduan table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  details.panduan th, details.panduan td { border: 1px solid var(--hairline); padding: 6px 10px; text-align: left; }
  details.panduan th { background: var(--panel2); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>SIPATURE Adjudicator</h1>
  <span class="progress" id="progress">–</span>
  <button id="guide" onclick="toggleGuide()">Panduan</button>
  <button id="export" style="margin-left:auto" disabled>Export adjudicated.jsonl</button>
</header>
<main>
  <div class="sidebar" id="sidebar"><div class="empty">Memuat…</div></div>
  <div class="detail" id="detail"><div class="empty">Pilih review di daftar.</div></div>
</main>

<script>
const state = {
  aspects: [], polarities: [], severities: [],
  reviews: [], current: null, currentLabels: [], evidenceFocus: null, currentSource: null,
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function init() {
  const meta = await api("/api/meta");
  state.aspects = meta.aspects;
  state.polarities = meta.polarities;
  state.severities = meta.severities;
  await loadReviews();
  if (state.reviews.length) openReview(0);
}

async function loadReviews() {
  const data = await api("/api/reviews");
  state.reviews = data.reviews;
  const done = data.done;
  document.getElementById("progress").innerHTML =
    `Adjudicated: <strong>${done}</strong> / ${data.total}`;
  document.getElementById("export").disabled = done < data.total;
  renderSidebar();
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = state.reviews.map((r, i) => `
    <div class="item ${state.current === i ? 'active' : ''}" onclick="openReview(${i})">
      <span class="dot ${r.status === 'adjudicated' ? 'done' : 'pending'}"></span>
      ${r.status === 'adjudicated' ? '✓' : '•'} ${esc(r.destination_name || r.review_id.slice(-8))}
      <div class="snip">${esc(r.text.slice(0, 70))}</div>
    </div>`).join("");
}

function openReview(index) {
  state.current = index;
  const r = state.reviews[index];
  state.currentLabels = JSON.parse(JSON.stringify(r.labels || []));
  state.currentSource = null;
  renderDetail(r);
  renderSidebar();
}

function labelOf(aspect) { return state.currentLabels.find(l => l.aspect === aspect); }

function aspectMeta(key) { return state.aspects.find(a => a.key === key); }

function chipHTML(label) {
  const polClass = "pol-" + label.polarity;
  const sev = label.polarity === "negative" ? ` · ${label.severity}` : "";
  return `<span class="chip"><span class="${polClass}">${esc(label.aspect)}: ${esc(label.polarity)}${sev}</span>` +
    (label.evidence_text ? `<span class="ev">“${esc(label.evidence_text)}”</span>` : "") + `</span>`;
}

function renderDetail(r) {
  const el = document.getElementById("detail");
  const annos = Object.entries(r.annotators || {});
  const kindLabel = r.destination_kind ? (r.destination_kind === "wisata" ? "Wisata" : r.destination_kind === "hotel" ? "Hotel" : r.destination_kind === "resto" ? "Restoran" : r.destination_kind) : "";
  const category = r.destination_category || "";
  el.innerHTML = `
    <div class="review-card">
      <div class="meta">
        ${kindLabel ? `<span class="dest-badge">${esc(kindLabel)}</span>` : ""}
        <strong style="font-size:15px">${esc(r.destination_name || "(tanpa nama)")}</strong>
        ${category ? ` · ${esc(category)}` : ""}
        <br><span style="opacity:.75">Review <code>${esc(r.review_id)}</code> · rating ${r.rating_context ?? "-"}</span>
      </div>
      <div class="review-text" id="text">${renderText(r.text)}</div>
    </div>
    <div class="review-card">
      <h3>Label per annotator <span class="hint">(klik "Pakai" untuk menyalin ke label final)</span></h3>
      <div class="anno-grid">
        ${annos.map(([aid, a]) => `
          <div class="anno-card ${state.currentSource === aid ? 'active' : ''}" data-aid="${esc(aid)}">
            <div class="who">${esc(aid)}</div>
            ${(a.labels || []).length ? (a.labels || []).map(chipHTML).join("") : '<div class="hint">(tidak ada label)</div>'}
            <div><button type="button" class="${state.currentSource === aid ? 'used' : ''}" onclick="useAnnotator('${esc(aid)}')">${state.currentSource === aid ? '✓ Terpakai' : 'Pakai ' + esc(aid)}</button></div>
          </div>`).join("")}
      </div>
    </div>
    <div class="review-card">
      <h3>Label final <span class="hint">(adjudikasi — tersimpan otomatis)</span></h3>
      <div class="aspect-list" id="aspects"></div>
    </div>`;
  renderAspects();
  bindTextClicks();
}

function useAnnotator(aid) {
  const r = state.reviews[state.current];
  const a = r.annotators[aid];
  if (!a) return;
  state.currentLabels = JSON.parse(JSON.stringify(a.labels || []));
  state.currentSource = aid;
  saveCurrent();
  renderDetail(r);
}

function updateSourceUI() {
  document.querySelectorAll(".anno-card").forEach(card => {
    const who = card.getAttribute("data-aid");
    const active = who === state.currentSource;
    card.classList.toggle("active", active);
    const btn = card.querySelector("button");
    if (btn) {
      btn.classList.toggle("used", active);
      btn.textContent = active ? "✓ Terpakai" : "Pakai " + who;
    }
  });
}

function renderText(text) {
  return text.split(/\s+/).filter(Boolean).map(w =>
    `<span class="word" data-w="${esc(w)}">${esc(w)}</span>`).join(" ");
}

function renderAspects() {
  const el = document.getElementById("aspects");
  el.innerHTML = state.aspects.map(a => {
    const lab = labelOf(a.key);
    const on = !!lab;
    const polarity = lab?.polarity || "negative";
    const severity = lab?.severity || "medium";
    const evidence = lab?.evidence_text || "";
    const sevVisible = polarity === "negative";
    return `
      <div class="aspect-card ${on ? 'on' : ''} ${state.evidenceFocus === a.key ? 'focus' : ''}" data-k="${a.key}" onmouseenter="highlightSeeds('${a.key}', true)" onmouseleave="highlightSeeds('${a.key}', false)">
        <div class="aspect-head" onclick="toggleAspect('${a.key}')">
          <input type="checkbox" ${on ? 'checked' : ''} onclick="event.stopPropagation(); toggleAspect('${a.key}')" />
          <div>
            <div class="name">${esc(a.label)}</div>
            <div class="def">${esc(a.definition)}</div>
            <div class="kw" style="font-size:11px;color:#7dd3fc;margin-top:2px">kata kunci: ${esc(a.hint)}</div>
          </div>
        </div>
        <div class="aspect-body">
          <div class="row">
            <span class="lbl">Polarity</span>
            <span class="seg polarity">
              ${state.polarities.map(p => `<button type="button" data-p="${p.key}" class="${p.key===polarity?'on':''}" onclick="event.stopPropagation(); setPolarity('${a.key}','${p.key}')">${p.key}</button>`).join("")}
            </span>
          </div>
          ${sevVisible ? `
          <div class="row">
            <span class="lbl">Severity</span>
            <span class="seg sev">
              ${state.severities.map(s => `<button type="button" data-s="${s.key}" class="${s.key===severity?'on':''}" onclick="event.stopPropagation(); setSeverity('${a.key}','${s.key}')">${s.key}</button>`).join("")}
            </span>
          </div>` : ''}
          <div class="row">
            <span class="lbl">Evidence</span>
            <input class="evidence-input" value="${esc(evidence)}" placeholder="klik kata di teks di atas" onfocus="state.evidenceFocus='${a.key}'" oninput="setEvidence('${a.key}', this.value)" />
          </div>
        </div>
      </div>`;
  }).join("");
}

function clearSource() {
  if (state.currentSource === null) return;
  state.currentSource = null;
  updateSourceUI();
}

function toggleAspect(key) {
  clearSource();
  const idx = state.currentLabels.findIndex(l => l.aspect === key);
  if (idx >= 0) state.currentLabels.splice(idx, 1);
  else {
    state.currentLabels.push({ aspect: key, polarity: "negative", severity: "medium", evidence_text: "" });
    state.evidenceFocus = key;
  }
  saveCurrent();
  renderAspects();
}

function setPolarity(key, pol) {
  clearSource();
  const lab = labelOf(key); if (!lab) return;
  lab.polarity = pol;
  if (pol !== "negative") lab.severity = null;
  else if (!lab.severity) lab.severity = "medium";
  saveCurrent(); renderAspects();
}

function setSeverity(key, sev) {
  clearSource();
  const lab = labelOf(key); if (!lab) return;
  lab.severity = sev;
  saveCurrent(); renderAspects();
}

function setEvidence(key, text) {
  clearSource();
  const lab = labelOf(key); if (!lab) return;
  lab.evidence_text = text;
  saveCurrent();
}

function seedWords(key) {
  const meta = aspectMeta(key);
  return (meta?.hint || "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
}

function highlightSeeds(key, on) {
  const terms = seedWords(key);
  document.querySelectorAll(".review-text .word").forEach(span => {
    const w = (span.getAttribute("data-w") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (w && terms.includes(w)) span.classList.toggle("hl", on);
  });
}

function toggleGuide() {
  const el = document.getElementById("detail");
  const existing = document.getElementById("panduan");
  if (existing) { existing.remove(); return; }
  const pol = state.polarities.map(p => `<tr><td><strong>${esc(p.key)}</strong></td><td>${esc(p.desc)}</td></tr>`).join("");
  const sev = state.severities.map(s => `<tr><td><strong>${esc(s.key)}</strong></td><td>${esc(s.desc)}</td></tr>`).join("");
  const aspects = state.aspects.map(a =>
    `<div class="card"><h4>${esc(a.label)}</h4><p>${esc(a.definition)}</p><div class="kw">kata kunci: ${esc(a.hint)}</div></div>`
  ).join("");
  el.insertAdjacentHTML("afterbegin", `
    <details class="panduan" id="panduan" open>
      <summary>📘 Panduan Adjudikasi</summary>
      <p class="hint" style="font-size:13px;color:var(--muted);line-height:1.7">
        1. Baca <strong>nama tempat</strong> (badge di atas) + teks review. Jenis tempat membantu menebak aspek:
        hotel → kamar/kenyamanan; wisata → akses/pemandangan; resto → harga/pelayanan.<br>
        2. Lihat label tiap annotator (A1/A2/A3). Kalau setuju salah satu → klik <strong>"Pakai A…"</strong>.<br>
        3. Kalau perlu ubah: centang <strong>aspek</strong> → pilih <strong>polarity</strong> →
           kalau negative pilih <strong>severity</strong> → isi <strong>evidence</strong> (klik kata di teks).<br>
        4. Satu aspek = satu label. Evidence harus <strong>verbatim</strong> (klik kata, jangan ketik bebas).<br>
        5. Tersimpan otomatis — kerjakan sampai semua hijau (51/51), lalu <strong>Export adjudicated.jsonl</strong>.
      </p>
      <h3>Aspek (14)</h3>
      <div class="grid">${aspects}</div>
      <h3>Polarity</h3><table>${pol}</table>
      <h3>Severity (hanya negative)</h3><table>${sev}</table>
    </details>`);
}

function bindTextClicks() {
  document.querySelectorAll(".review-text .word").forEach(span => {
    span.onclick = () => {
      const w = span.getAttribute("data-w");
      const focus = state.evidenceFocus;
      if (!focus) return;
      const lab = labelOf(focus);
      if (!lab) return;
      clearSource();
      lab.evidence_text = (lab.evidence_text ? lab.evidence_text + " " : "") + w;
      const input = document.querySelector(`.aspect-card[data-k="${focus}"] input.evidence-input`);
      if (input) input.value = lab.evidence_text;
      saveCurrent();
    };
  });
}

function saveCurrent() {
  const r = state.reviews[state.current];
  r.labels = state.currentLabels;
  r.status = "adjudicated";
  api(`/api/reviews/${r.review_id}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ labels: state.currentLabels }),
  }).then(() => {
    const done = state.reviews.filter(x => x.status === "adjudicated").length;
    document.getElementById("progress").innerHTML =
      `Adjudicated: <strong>${done}</strong> / ${state.reviews.length}`;
    document.getElementById("export").disabled = done < state.reviews.length;
    renderSidebar();
  }).catch(err => alert(err.message));
}

document.getElementById("export").onclick = () => {
  fetch("/api/export").then(async res => {
    if (!res.ok) { alert(await res.text()); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "adjudicated.jsonl"; a.click();
    URL.revokeObjectURL(url);
  });
};

function esc(s) {
  return (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

init();
</script>
</body>
</html>
