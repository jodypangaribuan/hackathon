# Reverse proxy untuk martahuta.jodypangaribuan.my.id
#
# Origin ini TIDAK terekspos langsung ke internet. Server berada di belakang
# CGNAT IndiHome, jadi trafik masuk lewat Cloudflare Tunnel:
#
#   internet -> Cloudflare edge -> cloudflared -> nginx:80 -> web:3000
#
# TLS diterminasi Cloudflare; di sini cukup HTTP polos.

# Hanya kirim "Connection: upgrade" bila klien memang meminta upgrade.
# Tanpa map ini setiap request HTTP biasa ikut membawa token hop-by-hop
# yang keliru (dan keep-alive ke upstream jadi mati permanen).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# cloudflared sudah mengirim X-Forwarded-Proto: https. Menimpanya dengan
# $scheme (yang di sini selalu "http") membuat aplikasi mengira dirinya
# dilayani tanpa TLS — sumber redirect loop begitu ada absolute redirect
# atau "Always Use HTTPS" di Cloudflare. Pertahankan nilai asli bila ada.
map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    # default_server tanpa "return 444": di balik tunnel, penyaringan hostname
    # sudah dilakukan ingress rules Cloudflare. Menolak Host yang tak cocok di
    # sini justru memutus health check dan debugging dari dalam container.
    listen 80 default_server;
    server_name martahuta.jodypangaribuan.my.id _;

    # DNS internal Docker. Wajib memakai resolver + variabel pada proxy_pass:
    # nama host literal hanya di-resolve sekali saat start, sehingga nginx akan
    # memegang IP basi (dan membalas 502) begitu container web di-recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $martahuta_app web:3000;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Next sudah mengirim sendiri "max-age=31536000, immutable" untuk aset
    # ber-hash ini, jadi jangan ditambahkan lagi (header ganda). Blok ini
    # hanya untuk meredam log akses aset statis.
    location /_next/static/ {
        proxy_pass http://$martahuta_app;
        access_log off;
    }

    # Next tidak mengirim Cache-Control untuk route handler ini, sedangkan
    # endpoint ini dipakai healthcheck container dan juri — pastikan segar.
    location = /api/health {
        proxy_pass http://$martahuta_app;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location / {
        proxy_pass http://$martahuta_app;
        proxy_read_timeout 60s;
    }
}
