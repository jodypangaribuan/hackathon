<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIPATURE Annotator</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --hairline: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #2a78d6; --good: #16a34a;
    --bad: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 16px;
           border-bottom: 1px solid var(--hairline); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header select, header button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--hairline);
           background: var(--panel2); color: var(--text); font-size: 13px; cursor: pointer; }
  .progress { font-size: 13px; color: var(--muted); }
  .progress strong { color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }
  .sidebar { border-right: 1px solid var(--hairline); overflow-y: auto; background: var(--panel); }
  .sidebar .item { padding: 10px 14px; border-bottom: 1px solid var(--hairline); cursor: pointer; font-size: 13px; }
  .sidebar .item:hover { background: var(--panel2); }
  .sidebar .item.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .sidebar .item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .dot.done { background: var(--good); } .dot.pending { background: var(--warn); }
  .sidebar .item .snip { color: var(--muted); font-size: 12px; margin-top: 3px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { overflow-y: auto; padding: 20px; }
  .review-card { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px; padding: 18px; }
  .review-text { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
  .review-text span.word { cursor: pointer; border-radius: 3px; }
  .review-text span.word:hover { background: var(--accent); }
  .review-text span.word.hl { background: rgba(42,120,214,0.30); }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  h3 { font-size: 14px; margin: 22px 0 10px; }
  .aspect-list { display: flex; flex-direction: column; gap: 8px; }
  .aspect-card { border: 1px solid var(--hairline); border-radius: 8px; background: var(--panel2); overflow: hidden; }
  .aspect-card.on { border-color: var(--accent); }
  .aspect-head { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; cursor: pointer; }
  .aspect-head:hover { background: rgba(42,120,214,0.08); }
  .aspect-head input[type=checkbox] { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
  .aspect-head .name { font-size: 13.5px; font-weight: 600; }
  .aspect-head .def { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .aspect-body { padding: 0 12px 12px 38px; display: none; }
  .aspect-card.on .aspect-body { display: block; }
  .aspect-body .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 6px 12px; cursor: pointer; background: var(--panel2); color: var(--text); font-size: 12px; }
  .seg button.on { background: var(--accent); color: white; }
  .seg.pos button.on { background: var(--good); }
  .seg.neg button.on { background: var(--bad); }
  .seg.sev button.on { background: var(--warn); }
  .aspect-body input { flex: 1; min-width: 180px; padding: 7px 10px; border-radius: 6px;
           border: 1px solid var(--hairline); background: var(--panel); color: var(--text); font-size: 12.5px; }
  .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 14px; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
  details.panduan { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px;
           padding: 14px 16px; margin-bottom: 16px; }
  details.panduan summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details.panduan .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 12px; }
  details.panduan .card { background: var(--panel2); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 12px; }
  details.panduan .card h4 { margin: 0 0 4px; font-size: 13px; }
  details.panduan .card p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  details.panduan table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  details.panduan th, details.panduan td { border: 1px solid var(--hairline); padding: 6px 10px; text-align: left; }
  details.panduan th { background: var(--panel2); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>SIPATURE Annotator</h1>
  <label>Annotator:
    <select id="annotator"></select>
  </label>
  <span class="progress" id="progress">–</span>
  <button id="guide" onclick="toggleGuide()">Panduan</button>
  <button id="export" style="margin-left:auto" disabled>Export JSONL</button>
</header>
<main>
  <div class="sidebar" id="sidebar"><div class="empty">Pilih annotator untuk mulai.</div></div>
  <div class="detail" id="detail"><div class="empty">Pilih review di daftar.</div></div>
</main>

<script>
const state = {
  annotators: [], aspects: [], polarities: [], severities: [],
  annotator: null, reviews: [], current: null, currentLabels: [], evidenceFocus: null,
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function init() {
  const meta = await api("/api/annotators");
  state.annotators = meta.annotators;
  state.aspects = meta.aspects;
  state.polarities = meta.polarities;
  state.severities = meta.severities;
  const sel = document.getElementById("annotator");
  sel.innerHTML = '<option value="">— pilih —</option>' +
    state.annotators.map(a => `<option>${a}</option>`).join("");
  sel.onchange = () => selectAnnotator(sel.value);
}

function aspectMeta(key) { return state.aspects.find(a => a.key === key); }

function toggleGuide() {
  const el = document.getElementById("detail");
  const existing = document.getElementById("panduan");
  if (existing) { existing.remove(); return; }
  const pol = state.polarities.map(p => `<tr><td><strong>${esc(p.key)}</strong></td><td>${esc(p.desc)}</td></tr>`).join("");
  const sev = state.severities.map(s => `<tr><td><strong>${esc(s.key)}</strong></td><td>${esc(s.desc)}</td></tr>`).join("");
  el.insertAdjacentHTML("afterbegin", `
    <details class="panduan" id="panduan" open>
      <summary>📘 Panduan</summary>
      <p class="hint" style="font-size:13px;color:var(--muted);line-height:1.7">
        1. Baca review.<br>
        2. Centang <strong>aspek</strong> yang dibahas (boleh lebih dari satu).<br>
        3. Untuk tiap aspek, pilih <strong>polarity</strong> (default: negative).<br>
        4. Kalau negative, pilih <strong>severity</strong> (default: medium).<br>
        5. Isi <strong>evidence</strong>: klik kata di teks review untuk kutip verbatim.<br>
        6. Tersimpan otomatis — lanjut review berikutnya.
      </p>
      <h3>Polarity</h3><table>${pol}</table>
      <h3>Severity (hanya negative)</h3><table>${sev}</table>
    </details>`);
}

async function selectAnnotator(id) {
  if (!id) return;
  state.annotator = id;
  const data = await api(`/api/annotator/${id}/reviews`);
  state.reviews = data.reviews;
  renderSidebar();
  document.getElementById("export").disabled = false;
  openReview(0);
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  const done = state.reviews.filter(r => r.status === "completed").length;
  document.getElementById("progress").innerHTML =
    `Progress: <strong>${done}</strong> / ${state.reviews.length}`;
  sb.innerHTML = state.reviews.map((r, i) => `
    <div class="item ${state.current === i ? 'active' : ''}" onclick="openReview(${i})">
      <span class="dot ${r.status === 'completed' ? 'done' : 'pending'}"></span>
      ${r.status === 'completed' ? '✓' : '•'} ${r.review_id.slice(-8)}
      <div class="snip">${esc(r.text.slice(0, 70))}</div>
    </div>`).join("");
}

function openReview(index) {
  state.current = index;
  const r = state.reviews[index];
  state.currentLabels = JSON.parse(JSON.stringify(r.labels || []));
  renderDetail(r);
  renderSidebar();
}

function labelOf(aspect) { return state.currentLabels.find(l => l.aspect === aspect); }

function renderDetail(r) {
  const el = document.getElementById("detail");
  el.innerHTML = `
    <div class="review-card">
      <div class="meta">
        Review <code>${esc(r.review_id)}</code> · rating ${r.rating_context ?? "-"}
      </div>
      <div class="review-text" id="text">${renderText(r.text)}</div>
      <h3>Aspek yang dibahas <span class="hint">(centang yang relevan)</span></h3>
      <div class="aspect-list" id="aspects"></div>
    </div>`;
  renderAspects();
  bindTextClicks();
}

function renderText(text) {
  return text.split(/\s+/).filter(Boolean).map(w =>
    `<span class="word" data-w="${esc(w)}">${esc(w)}</span>`).join(" ");
}

function renderAspects() {
  const el = document.getElementById("aspects");
  el.innerHTML = state.aspects.map(a => {
    const lab = labelOf(a.key);
    const on = !!lab;
    const polarity = lab?.polarity || "negative";
    const severity = lab?.severity || "medium";
    const evidence = lab?.evidence_text || "";
    const sevVisible = polarity === "negative";
    return `
      <div class="aspect-card ${on ? 'on' : ''}" data-k="${a.key}">
        <div class="aspect-head" onclick="toggleAspect('${a.key}')">
          <input type="checkbox" ${on ? 'checked' : ''} onclick="event.stopPropagation(); toggleAspect('${a.key}')" />
          <div>
            <div class="name">${esc(a.label)}</div>
            <div class="def">${esc(a.definition)}</div>
          </div>
        </div>
        <div class="aspect-body">
          <div class="row">
            <span class="lbl">Polarity</span>
            <span class="seg pos">
              ${state.polarities.map(p => `<button type="button" data-p="${p.key}" class="${p.key===polarity?'on':''}" onclick="event.stopPropagation(); setPolarity('${a.key}','${p.key}')">${p.key}</button>`).join("")}
            </span>
          </div>
          ${sevVisible ? `
          <div class="row">
            <span class="lbl">Severity</span>
            <span class="seg sev">
              ${state.severities.map(s => `<button type="button" data-s="${s.key}" class="${s.key===severity?'on':''}" onclick="event.stopPropagation(); setSeverity('${a.key}','${s.key}')">${s.key}</button>`).join("")}
            </span>
          </div>` : ''}
          <div class="row">
            <span class="lbl">Evidence</span>
            <input value="${esc(evidence)}" placeholder="klik kata di teks di atas" onfocus="state.evidenceFocus='${a.key}'" oninput="setEvidence('${a.key}', this.value)" />
          </div>
        </div>
      </div>`;
  }).join("");
}

function toggleAspect(key) {
  const idx = state.currentLabels.findIndex(l => l.aspect === key);
  if (idx >= 0) state.currentLabels.splice(idx, 1);
  else state.currentLabels.push({ aspect: key, polarity: "negative", severity: "medium", evidence_text: "" });
  saveCurrent();
  renderAspects();
}

function setPolarity(key, pol) {
  const lab = labelOf(key); if (!lab) return;
  lab.polarity = pol;
  if (pol !== "negative") lab.severity = null;
  else if (!lab.severity) lab.severity = "medium";
  saveCurrent(); renderAspects();
}

function setSeverity(key, sev) {
  const lab = labelOf(key); if (!lab) return;
  lab.severity = sev;
  saveCurrent(); renderAspects();
}

function setEvidence(key, text) {
  const lab = labelOf(key); if (!lab) return;
  lab.evidence_text = text;
  saveCurrent();
}

function bindTextClicks() {
  document.querySelectorAll(".review-text .word").forEach(span => {
    span.onclick = () => {
      const w = span.getAttribute("data-w");
      const focus = state.evidenceFocus;
      if (!focus) return;
      const lab = labelOf(focus);
      if (!lab) return;
      lab.evidence_text = (lab.evidence_text ? lab.evidence_text + " " : "") + w;
      saveCurrent();
      renderAspects();
      const input = document.querySelector(`.aspect-card[data-k="${focus}"] input`);
      if (input) input.focus();
    };
  });
}

function saveCurrent() {
  const r = state.reviews[state.current];
  r.labels = state.currentLabels;
  r.status = state.currentLabels.length ? "completed" : "pending";
  api(`/api/annotator/${state.annotator}/reviews/${r.review_id}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ labels: state.currentLabels, status: r.status }),
  }).catch(err => console.error(err));
  renderSidebar();
}

document.getElementById("export").onclick = () => {
  window.location.href = `/api/annotator/${state.annotator}/export`;
};

function esc(s) {
  return (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

init();
</script>
</body>
</html>
