[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipature-ml"
version = "0.1.0"
description = "Data and model pipeline for SIPATURE tourism early-warning intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<20",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.6,<4",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
eda = ["jupyter>=1,<2", "seaborn>=0.13,<1"]
train = [
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
  "datasets>=2.18,<4",
  "accelerate>=0.29,<2",
  "evaluate>=0.4,<1",
]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[project.scripts]
sipature-ml = "sipature_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
