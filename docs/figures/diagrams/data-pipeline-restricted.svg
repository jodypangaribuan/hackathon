<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-title medallion-desc">
      <title id="medallion-title">Lapisan data SIPATURE dari mentah hingga agregat aman</title>
      <desc id="medallion-desc">Lima lapisan data mengalir dari CSV mentah yang memuat identitas reviewer, melalui pembersihan, anotasi, dan agregasi, menuju bundle agregat aman yang dipublikasikan tanpa identitas reviewer.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <clipPath id="clip-raw"><rect x="16" y="80" width="172" height="280" rx="6"/></clipPath>
        <clipPath id="clip-clean"><rect x="204" y="80" width="172" height="280" rx="6"/></clipPath>
        <clipPath id="clip-label"><rect x="392" y="80" width="172" height="280" rx="6"/></clipPath>
        <clipPath id="clip-agg"><rect x="580" y="80" width="172" height="280" rx="6"/></clipPath>
        <clipPath id="clip-safe"><rect x="768" y="80" width="172" height="280" rx="6"/></clipPath>
      </defs>
      <rect width="1040" height="440" fill="#f5f5f5"/>

      <!-- Promotion arcs -->
      <path d="M102 80 C102 0 290 0 290 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M290 80 C290 0 478 0 478 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M478 80 C478 0 666 0 666 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M666 80 C666 0 854 0 854 80" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="196" y="50" class="arc-label" fill="#4f5d75">CLEAN + ER</text>
      <text x="384" y="50" class="arc-label" fill="#4f5d75">ANNOTATE</text>
      <text x="572" y="50" class="arc-label" fill="#4f5d75">INFER + AGG</text>
      <text x="760" y="50" class="arc-label" fill="#eb6c36">PRIVACY GATE</text>

      <!-- Raw -->
      <rect x="16" y="80" width="172" height="280" rx="6" fill="#fff"/>
      <rect x="16" y="80" width="172" height="50" fill="rgba(79,93,117,0.10)" clip-path="url(#clip-raw)"/>
      <rect x="16" y="80" width="172" height="280" rx="6" fill="none" stroke="#4f5d75"/>
      <text x="102" y="106" class="tier-title">Raw</text>
      <text x="102" y="144" class="bucket">22.302 record</text>
      <text x="32" y="184" class="field-label">Identitas</text>
      <text x="32" y="200" class="field-value">reviewer ADA</text>
      <text x="32" y="232" class="field-label">Akses</text>
      <text x="32" y="248" class="field-value">restricted</text>

      <!-- Clean -->
      <rect x="204" y="80" width="172" height="280" rx="6" fill="#fff"/>
      <rect x="204" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-clean)"/>
      <rect x="204" y="80" width="172" height="280" rx="6" fill="none" stroke="#2d3142"/>
      <text x="290" y="106" class="tier-title">Clean &amp; Linked</text>
      <text x="290" y="144" class="bucket">22.169 · 388 ID</text>
      <text x="220" y="184" class="field-label">Identitas</text>
      <text x="220" y="200" class="field-value">review_id hash</text>
      <text x="220" y="232" class="field-label">Akses</text>
      <text x="220" y="248" class="field-value">restricted</text>

      <!-- Label -->
      <rect x="392" y="80" width="172" height="280" rx="6" fill="#fff"/>
      <rect x="392" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-label)"/>
      <rect x="392" y="80" width="172" height="280" rx="6" fill="none" stroke="#2d3142"/>
      <text x="478" y="106" class="tier-title">Label</text>
      <text x="478" y="144" class="bucket">1.320 · Jaccard 0.97</text>
      <text x="408" y="184" class="field-label">Identitas</text>
      <text x="408" y="200" class="field-value">teks review</text>
      <text x="408" y="232" class="field-label">Akses</text>
      <text x="408" y="248" class="field-value">restricted</text>

      <!-- Aggregate -->
      <rect x="580" y="80" width="172" height="280" rx="6" fill="#fff"/>
      <rect x="580" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-agg)"/>
      <rect x="580" y="80" width="172" height="280" rx="6" fill="none" stroke="#2d3142"/>
      <text x="666" y="106" class="tier-title">Aggregate</text>
      <text x="666" y="144" class="bucket">1.682 sinyal</text>
      <text x="596" y="184" class="field-label">Identitas</text>
      <text x="596" y="200" class="field-value">evidence verbatim</text>
      <text x="596" y="232" class="field-label">Akses</text>
      <text x="596" y="248" class="field-value">restricted</text>

      <!-- Safe product (focal) -->
      <rect x="768" y="80" width="172" height="280" rx="6" fill="rgba(235,108,54,0.07)"/>
      <rect x="768" y="80" width="172" height="50" fill="rgba(235,108,54,0.14)" clip-path="url(#clip-safe)"/>
      <rect x="768" y="80" width="172" height="280" rx="6" fill="none" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="854" y="106" class="tier-title">Safe Product</text>
      <text x="854" y="144" class="bucket focal-text">103 dest · 210 isu</text>
      <text x="784" y="184" class="field-label">Identitas</text>
      <text x="784" y="200" class="field-value focal-text">TIDAK ADA</text>
      <text x="784" y="232" class="field-label">Akses</text>
      <text x="784" y="248" class="field-value focal-text">published</text>

      <!-- Write-method paths -->
      <rect x="16" y="384" width="460" height="44" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <text x="32" y="408" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Batch</text>
      <text x="32" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">infer-corpus · deterministik · hash-verified</text>
      <rect x="492" y="384" width="460" height="44" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <text x="508" y="408" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Live</text>
      <text x="508" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">/predict-review · FastAPI · p50 2.1 ms</text>
    </svg>