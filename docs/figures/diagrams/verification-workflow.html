<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Alur Kerja Verifikasi Sinyal</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame {
      width: 100%;
      max-width: 1100px;
    }
    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 1.5rem;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 980px;
    }
    .step-num {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: #ffffff;
      opacity: 0.85;
    }
    .step-title {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 600;
      fill: #ffffff;
    }
    .item-title {
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
      fill: var(--ink);
    }
    .item-desc {
      font-family: var(--mono);
      font-size: 8px;
      fill: var(--muted);
    }
    .badge-title {
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
    }
    .badge-desc {
      font-family: var(--mono);
      font-size: 8px;
    }
    .decision-title {
      font-family: var(--sans);
      font-size: 11.5px;
      font-weight: 600;
    }
    .decision-main {
      font-family: var(--sans);
      font-size: 9.5px;
    }
    .decision-sub {
      font-family: var(--mono);
      font-size: 8px;
    }
    .loop-text {
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 500;
      fill: var(--accent);
    }
    .footer-text {
      font-family: var(--mono);
      font-size: 8.5px;
      fill: var(--muted);
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Interactive Process · Diagram Design</p>
    <h1>Alur kerja verifikasi sinyal &amp; siklus umpan balik (human-in-the-loop)</h1>

    <svg viewBox="0 0 1040 354" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wf-title wf-desc">
      <title id="wf-title">Alur Kerja Verifikasi Sinyal SIPATURE</title>
      <desc id="wf-desc">Diagram alur kerja manusia dalam loop (human-in-the-loop) dari sinyal awal, audit bukti ulasan, keputusan tiga cabang pengelola, hingga rekomendasi tindakan dan pembelajaran model.</desc>
      
      <defs>
        <marker id="arrow-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 8 5 L 0 9 z" fill="#2d3142"/>
        </marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 8 5 L 0 9 z" fill="#eb6c36"/>
        </marker>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

      <!-- ================= TAHAP 1: SISTEM (x=24, w=210) ================= -->
      <rect x="24" y="20" width="210" height="236" rx="8" fill="#fff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <rect x="24" y="20" width="210" height="52" rx="8" fill="#2d3142"/>
      <rect x="24" y="62" width="210" height="10" fill="#2d3142"/>
      <text x="129" y="38" class="step-num" text-anchor="middle">TAHAP 01 · SISTEM</text>
      <text x="129" y="56" class="step-title" text-anchor="middle">Deteksi Sinyal Awal</text>

      <!-- Action 1.1 -->
      <rect x="36" y="82" width="186" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.08)" stroke-width="0.6"/>
      <text x="46" y="98" class="item-title">Ekstraksi 14 Aspek NLP</text>
      <text x="46" y="110" class="item-desc">Model TF-IDF &amp; Polaritas Leksikal</text>

      <!-- Action 1.2 -->
      <rect x="36" y="124" width="186" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.08)" stroke-width="0.6"/>
      <text x="46" y="140" class="item-title">Normalisasi Support</text>
      <text x="46" y="152" class="item-desc">Bayesian Smoothing &amp; Log Exposure</text>

      <!-- Output Badge -->
      <rect x="36" y="168" width="186" height="42" rx="4" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="46" y="186" class="badge-title" fill="#2d3142">1.682 Sinyal Terdeteksi</text>
      <text x="46" y="200" class="badge-desc" fill="#4f5d75">Status: Unverified Alert (Queue)</text>

      <!-- Arrow 1 -> 2 -->
      <line x1="234" y1="138" x2="268" y2="138" stroke="#2d3142" stroke-width="1.4" marker-end="url(#arrow-ink)"/>


      <!-- ================= TAHAP 2: OPERATOR (x=276, w=210) ================= -->
      <rect x="276" y="20" width="210" height="236" rx="8" fill="#fff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <rect x="276" y="20" width="210" height="52" rx="8" fill="#2d3142"/>
      <rect x="276" y="62" width="210" height="10" fill="#2d3142"/>
      <text x="381" y="38" class="step-num" text-anchor="middle">TAHAP 02 · OPERATOR</text>
      <text x="381" y="56" class="step-title" text-anchor="middle">Pemeriksaan Bukti</text>

      <!-- Action 2.1 -->
      <rect x="288" y="82" width="186" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.08)" stroke-width="0.6"/>
      <text x="298" y="98" class="item-title">Audit Bukti Verbatim</text>
      <text x="298" y="110" class="item-desc">Kutipan Asli Ulasan Wisatawan</text>

      <!-- Action 2.2 -->
      <rect x="288" y="124" width="186" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.08)" stroke-width="0.6"/>
      <text x="298" y="140" class="item-title">Verifikasi Lapangan Fisik</text>
      <text x="298" y="152" class="item-desc">Kesesuaian Tanggal &amp; Lokasi</text>

      <!-- Oversight Badge -->
      <rect x="288" y="168" width="186" height="42" rx="4" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="298" y="186" class="badge-title" fill="#2d3142">Human Oversight Gate</text>
      <text x="298" y="200" class="badge-desc" fill="#4f5d75">Mencegah Keputusan Sepihak AI</text>

      <!-- Arrow 2 -> 3 Branches -->
      <line x1="486" y1="138" x2="516" y2="138" stroke="#2d3142" stroke-width="1.4"/>
      <line x1="516" y1="56" x2="516" y2="220" stroke="#2d3142" stroke-width="1.4"/>
      <line x1="516" y1="56" x2="530" y2="56" stroke="#2d3142" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
      <line x1="516" y1="138" x2="530" y2="138" stroke="#2d3142" stroke-width="1.4" marker-end="url(#arrow-ink)"/>
      <line x1="516" y1="220" x2="530" y2="220" stroke="#2d3142" stroke-width="1.4" marker-end="url(#arrow-ink)"/>


      <!-- ================= TAHAP 3: KEPUTUSAN OPERATOR (x=534, w=220) ================= -->
      <!-- Branch 1: CONFIRMED (Focal) -->
      <rect x="534" y="20" width="220" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="546" y="42" class="decision-title" fill="#eb6c36">✓ CONFIRMED (Terkonfirmasi)</text>
      <text x="546" y="58" class="decision-main" fill="#eb6c36">Masalah nyata terbukti di lapangan</text>
      <text x="546" y="74" class="decision-sub" fill="#eb6c36">Diteruskan ke rencana aksi fisik</text>

      <!-- Branch 2: REJECTED -->
      <rect x="534" y="102" width="220" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="546" y="124" class="decision-title" fill="#2d3142">✕ REJECTED (Alarm Palsu)</text>
      <text x="546" y="140" class="decision-main" fill="#4f5d75">False positive / sentimen keliru</text>
      <text x="546" y="156" class="decision-sub" fill="#7a8399">Wajib mengisi alasan penolakan</text>

      <!-- Branch 3: UNCERTAIN -->
      <rect x="534" y="184" width="220" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <text x="546" y="206" class="decision-title" fill="#2d3142">? UNCERTAIN (Belum Pasti)</text>
      <text x="546" y="222" class="decision-main" fill="#4f5d75">Data ulasan belum konklusif</text>
      <text x="546" y="238" class="decision-sub" fill="#7a8399">Masuk daftar pantau (watch list)</text>

      <!-- Arrow Branch 1 -> Tahap 4 -->
      <line x1="754" y1="56" x2="794" y2="56" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>


      <!-- ================= TAHAP 4: TINDAK LANJUT (x=802, w=214) ================= -->
      <rect x="802" y="20" width="214" height="236" rx="8" fill="#fff" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="802" y="20" width="214" height="52" rx="8" fill="#eb6c36"/>
      <rect x="802" y="62" width="214" height="10" fill="#eb6c36"/>
      <text x="909" y="38" class="step-num" fill="#fff" text-anchor="middle">TAHAP 04 · OPERASIONAL</text>
      <text x="909" y="56" class="step-title" fill="#fff" text-anchor="middle">Rekomendasi Tindakan</text>

      <!-- Action 4.1 -->
      <rect x="814" y="82" width="190" height="36" rx="4" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.12)" stroke-width="0.6"/>
      <text x="824" y="98" class="item-title" fill="#eb6c36">Perbaikan Fasilitas Fisik</text>
      <text x="824" y="110" class="item-desc" fill="#eb6c36">Sanitasi, Akses Jalan, &amp; Parkir</text>

      <!-- Action 4.2 -->
      <rect x="814" y="124" width="190" height="36" rx="4" fill="rgba(235,108,54,0.06)" stroke="rgba(235,108,54,0.12)" stroke-width="0.6"/>
      <text x="824" y="140" class="item-title" fill="#eb6c36">Alokasi Anggaran BPODT</text>
      <text x="824" y="152" class="item-desc" fill="#eb6c36">Intervensi Tepat Sasaran</text>

      <!-- Output Focal Badge -->
      <rect x="814" y="168" width="190" height="42" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="824" y="186" class="badge-title" fill="#eb6c36">210 Isu Terverifikasi</text>
      <text x="824" y="200" class="badge-desc" fill="#eb6c36">pada 103 Destinasi Wisata</text>


      <!-- ================= SIKLUS UMPAN BALIK (FEEDBACK LOOP) ================= -->
      <!-- Returning path from Decision Branches to Stage 1 -->
      <path d="M 644 266 L 644 320 L 129 320 L 129 262" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
      <rect x="220" y="304" width="390" height="32" rx="16" fill="#fff" stroke="#eb6c36" stroke-width="1"/>
      <text x="415" y="324" class="loop-text" text-anchor="middle">SIKLUS UMPAN BALIK: Kalibrasi Threshold &amp; Retraining Model</text>


    </svg>
  </main>
</body>
</html>
