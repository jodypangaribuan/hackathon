  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame {
      width: 100%;
      max-width: 1080px;
    }
    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 1.5rem;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 960px;
    }
    .pillar-num {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: #ffffff;
      opacity: 0.85;
    }
    .pillar-title {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
    }
    .aspect-name {
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
      fill: var(--ink);
    }
    .aspect-slug {
      font-family: var(--mono);
      font-size: 7.5px;
      fill: var(--soft);
    }
    .kw-tag-text {
      font-family: var(--mono);
      font-size: 7.5px;
      fill: #4f5d75;
    }
    .footer-text {
      font-family: var(--mono);
      font-size: 8.5px;
      fill: var(--muted);
    }
  </style>
</head>
