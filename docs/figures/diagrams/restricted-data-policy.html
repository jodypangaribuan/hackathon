<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Restricted Data Policy Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame {
      width: 100%;
      max-width: 860px;
    }
    .eyebrow {
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 0.35rem;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .subtitle {
      margin-bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 740px;
    }
    .head-name {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
    }
    .head-sub {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 8.5px;
    }
    .role-name {
      fill: #ffffff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
    }
    .role-code {
      fill: #ffffff;
      font-family: var(--mono);
      font-size: 8.5px;
      opacity: 0.85;
    }
    .comp-name {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
    }
    .comp-hint {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 8.5px;
    }
    .cell-val-none {
      fill: var(--soft);
      font-family: var(--mono);
      font-size: 9.5px;
    }
    .cell-val-admin {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
    }
    .cell-val-read {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
    }
    .cell-sub {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.02em;
    }
    .legend-text {
      font-family: var(--mono);
      font-size: 8.5px;
      fill: var(--muted);
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">DP security matrix · Diagram Design</p>
    <h1>Matriks akses tiga peran × lima komponen data</h1>
    <p class="subtitle">Tiga peran × lima komponen data; artefak mentah hingga evidence dibatasi ke tim ML, hanya agregat aman yang dipublikasikan.</p>

    <svg viewBox="0 0 740 360" role="img" aria-labelledby="dp-matrix-title dp-matrix-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="dp-matrix-title">Matriks akses data terbatas SIPATURE</title>
      <desc id="dp-matrix-desc">Matriks izin tiga peran dan lima komponen data, menunjukkan status izin Admin, Read, atau None.</desc>

      <rect width="740" height="360" fill="#f5f5f5"/>

      <!-- ================= HEADER ROW ================= -->
      <!-- Component Header -->
      <rect x="16" y="16" width="208" height="52" rx="6" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="120" y="38" class="head-name" text-anchor="middle">Komponen Data</text>
      <text x="120" y="54" class="head-sub" text-anchor="middle">vs. Peran Pengguna</text>

      <!-- Role 1: Publik / Juri -->
      <rect x="236" y="16" width="148" height="52" rx="6" fill="#2d3142"/>
      <text x="310" y="37" class="role-name" text-anchor="middle">Publik / Juri</text>
      <text x="310" y="53" class="role-code" text-anchor="middle">GRP-PUBLIC</text>

      <!-- Role 2: Pengelola Destinasi -->
      <rect x="396" y="16" width="148" height="52" rx="6" fill="#2d3142"/>
      <text x="470" y="37" class="role-name" text-anchor="middle">Pengelola Destinasi</text>
      <text x="470" y="53" class="role-code" text-anchor="middle">GRP-OPERATOR</text>

      <!-- Role 3: Tim Data / ML -->
      <rect x="556" y="16" width="168" height="52" rx="6" fill="#2d3142"/>
      <text x="640" y="37" class="role-name" text-anchor="middle">Tim Data / ML</text>
      <text x="640" y="53" class="role-code" text-anchor="middle">GRP-ML (AUDIT &amp; DEV)</text>


      <!-- ================= ROW 1: RAW CSV ================= -->
      <rect x="16" y="80" width="208" height="36" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="28" y="102" class="comp-name">Raw CSV</text>
      <text x="212" y="102" class="comp-hint" text-anchor="end">reviewer-id</text>

      <rect x="236" y="80" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="310" y="102" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="396" y="80" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="470" y="102" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="556" y="80" width="168" height="36" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.15)" stroke-width="0.6"/>
      <text x="640" y="102" class="cell-val-admin" text-anchor="middle">Admin</text>


      <!-- ================= ROW 2: CLEAN PARQUET ================= -->
      <rect x="16" y="124" width="208" height="36" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="28" y="146" class="comp-name">Clean Parquet</text>
      <text x="212" y="146" class="comp-hint" text-anchor="end">canonical hash</text>

      <rect x="236" y="124" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="310" y="146" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="396" y="124" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="470" y="146" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="556" y="124" width="168" height="36" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.15)" stroke-width="0.6"/>
      <text x="640" y="146" class="cell-val-admin" text-anchor="middle">Admin</text>


      <!-- ================= ROW 3: ANNOTATION ================= -->
      <rect x="16" y="168" width="208" height="36" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="28" y="190" class="comp-name">Annotation</text>
      <text x="212" y="190" class="comp-hint" text-anchor="end">silver + gold</text>

      <rect x="236" y="168" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="310" y="190" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="396" y="168" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="470" y="190" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="556" y="168" width="168" height="36" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.15)" stroke-width="0.6"/>
      <text x="640" y="190" class="cell-val-admin" text-anchor="middle">Admin</text>


      <!-- ================= ROW 4: EVIDENCE ================= -->
      <rect x="16" y="212" width="208" height="36" rx="4" fill="#fff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="28" y="234" class="comp-name">Evidence</text>
      <text x="212" y="234" class="comp-hint" text-anchor="end">verbatim audit</text>

      <rect x="236" y="212" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="310" y="234" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="396" y="212" width="148" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="470" y="234" class="cell-val-none" text-anchor="middle">None</text>

      <rect x="556" y="212" width="168" height="36" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.15)" stroke-width="0.6"/>
      <text x="640" y="234" class="cell-val-admin" text-anchor="middle">Admin</text>


      <!-- ================= ROW 5: SAFE AGGREGATE (FOCAL ★) ================= -->
      <rect x="16" y="256" width="208" height="42" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
      <text x="28" y="278" class="comp-name" fill="#eb6c36">Safe Aggregate</text>
      <text x="212" y="278" class="comp-hint" fill="#eb6c36" text-anchor="end">app bundle</text>
      <text x="28" y="292" class="cell-sub" fill="#eb6c36">Sanitized &amp; Published</text>

      <!-- Focal Cell: Publik Read -->
      <rect x="236" y="256" width="148" height="42" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="310" y="275" class="cell-val-read" fill="#eb6c36" font-size="11.5px" text-anchor="middle">Read</text>
      <text x="310" y="290" class="cell-sub" fill="#eb6c36" text-anchor="middle">dipublikasikan</text>

      <!-- Pengelola Read + Action -->
      <rect x="396" y="256" width="148" height="42" rx="4" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="470" y="275" class="cell-val-read" text-anchor="middle">Read</text>
      <text x="470" y="290" class="cell-sub" fill="#4f5d75" text-anchor="middle">verifikasi alur</text>

      <!-- Tim ML Admin -->
      <rect x="556" y="256" width="168" height="42" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="640" y="275" class="cell-val-admin" text-anchor="middle">Admin</text>
      <text x="640" y="290" class="cell-sub" fill="#4f5d75" text-anchor="middle">full audit</text>


      <!-- ================= LEGEND STRIP ================= -->
      <line x1="16" y1="316" x2="724" y2="316" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="16" y="338" class="legend-text" letter-spacing="0.14em">LEGEND</text>

      <rect x="84" y="328" width="14" height="12" rx="2" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.15)" stroke-width="0.6"/>
      <text x="104" y="338" class="legend-text">Admin (tim ML)</text>

      <rect x="228" y="328" width="14" height="12" rx="2" fill="rgba(79,93,117,0.08)" stroke="rgba(45,49,66,0.18)" stroke-width="0.6"/>
      <text x="248" y="338" class="legend-text">Read</text>

      <rect x="300" y="328" width="14" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.10)" stroke-width="0.6"/>
      <text x="320" y="338" class="legend-text">None (terisolasi)</text>

      <rect x="440" y="328" width="14" height="12" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="460" y="338" class="legend-text">Batas Publikasi (Focal)</text>
    </svg>
  </main>
</body>
</html>
