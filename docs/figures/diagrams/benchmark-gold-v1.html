<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPATURE · Benchmark Gold-v1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .frame {
      max-width: 1040px;
      width: 100%;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg {
      width: 100%;
      min-width: 820px;
      display: block;
    }
    .axis-label {
      font-family: var(--mono);
      font-size: 8.5px;
      fill: var(--muted);
    }
    .val-label {
      font-family: var(--mono);
      font-size: 9.5px;
      fill: var(--ink);
      font-weight: 600;
      text-anchor: middle;
    }
    .val-accent {
      font-family: var(--mono);
      font-size: 10px;
      fill: var(--accent);
      font-weight: 600;
      text-anchor: middle;
    }
    .group-title {
      font-family: var(--sans);
      font-size: 13.5px;
      font-weight: 600;
      fill: var(--ink);
      text-anchor: middle;
    }
    .group-sub {
      font-family: var(--mono);
      font-size: 8.5px;
      fill: var(--muted);
      text-anchor: middle;
    }
    .tag-text {
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 0.08em;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .delta-text {
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 0.04em;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Evaluation · Diagram Design</p>
    <h1>Perbandingan Macro F1 deteksi aspek — Silver vs Gold-v1</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bar-title bar-desc">
      <title id="bar-title">Perbandingan Macro F1 deteksi aspek pada silver dan gold-v1</title>
      <desc id="bar-desc">Bar chart berpasangan yang membandingkan Macro F1 pada data uji locked silver (garis arsir) versus benchmark manusia gold-v1 (solid) untuk model Keyword, TF-IDF, dan IndoBERT. TF-IDF dipilih sebagai model produksi.</desc>
      <defs>
        <!-- Background dots -->
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <!-- Diagonal hatch pattern for Silver bars -->
        <pattern id="hatch-silver" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(79,93,117,0.35)" stroke-width="2"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.45"/>

      <!-- Y-Axis Title -->
      <text transform="rotate(-90 28 236)" x="28" y="236" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.16em" text-anchor="middle">MACRO F1 SCORE</text>

      <!-- Horizontal Gridlines (64px step) -->
      <line x1="96" y1="80"  x2="944" y2="80"  stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="144" x2="944" y2="144" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="208" x2="944" y2="208" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="272" x2="944" y2="272" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="336" x2="944" y2="336" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="96" y1="400" x2="944" y2="400" stroke="rgba(45,49,66,0.25)" stroke-width="1.2"/>

      <!-- Y Axis vertical line -->
      <line x1="96" y1="80" x2="96" y2="400" stroke="rgba(45,49,66,0.25)" stroke-width="1.2"/>

      <!-- Y Axis Ticks -->
      <text x="86" y="83"  class="axis-label" text-anchor="end">1.00</text>
      <text x="86" y="147" class="axis-label" text-anchor="end">0.80</text>
      <text x="86" y="211" class="axis-label" text-anchor="end">0.60</text>
      <text x="86" y="275" class="axis-label" text-anchor="end">0.40</text>
      <text x="86" y="339" class="axis-label" text-anchor="end">0.20</text>
      <text x="86" y="403" class="axis-label" text-anchor="end">0.00</text>


      <!-- ================= GROUP 1: KEYWORD ================= -->
      <!-- Background container -->
      <rect x="176" y="36" width="144" height="364" rx="6" fill="rgba(45,49,66,0.02)"/>

      <!-- Top Tag Badge -->
      <rect x="196" y="44" width="104" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="248" y="56" class="tag-text" fill="#7a8399">CEILING SIRKULAR</text>

      <!-- Bar Silver: 0.9768 (Arsir, h=312, y=88, w=48) -->
      <rect x="192" y="88" width="48" height="312" rx="3" fill="#f5f5f5"/>
      <rect x="192" y="88" width="48" height="312" rx="3" fill="url(#hatch-silver)"/>
      <rect x="192" y="88" width="48" height="312" rx="3" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="216" y="78" class="val-label" fill="#4f5d75">0.9768</text>

      <!-- Bar Gold: 0.7056 (Solid, h=226, y=174, w=48) -->
      <rect x="256" y="174" width="48" height="226" rx="3" fill="#f5f5f5"/>
      <rect x="256" y="174" width="48" height="226" rx="3" fill="rgba(45,49,66,0.22)" stroke="#2d3142" stroke-width="1.2"/>
      <text x="280" y="164" class="val-label" fill="#2d3142">0.7056</text>

      <!-- Dashed Delta Drop Bracket (Drawn on top) -->
      <path d="M 240 88 L 280 88 L 280 150" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="254" y="112" width="52" height="16" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="280" y="123.5" class="delta-text" fill="#4f5d75">Δ -0.2712</text>

      <!-- Group 1 Labels -->
      <text x="248" y="426" class="group-title">Keyword (Lexicon)</text>
      <text x="248" y="442" class="group-sub">Baseline Rule Engine</text>


      <!-- ================= GROUP 2: TF-IDF (FOCAL / PRODUKSI) ================= -->
      <!-- Background container -->
      <rect x="448" y="36" width="144" height="364" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.25)" stroke-width="0.8"/>

      <!-- Top Tag Badge -->
      <rect x="468" y="44" width="104" height="16" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="520" y="56" class="tag-text" fill="#eb6c36" font-weight="600">MODEL PRODUKSI ★</text>

      <!-- Bar Silver: 0.7201 (Arsir, h=230, y=170, w=48) -->
      <rect x="464" y="170" width="48" height="230" rx="3" fill="#f5f5f5"/>
      <rect x="464" y="170" width="48" height="230" rx="3" fill="url(#hatch-silver)"/>
      <rect x="464" y="170" width="48" height="230" rx="3" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="488" y="160" class="val-label" fill="#4f5d75">0.7201</text>

      <!-- Bar Gold (Focal Accent): 0.5777 (Solid, h=185, y=215, w=48) -->
      <rect x="528" y="215" width="48" height="185" rx="3" fill="#f5f5f5"/>
      <rect x="528" y="215" width="48" height="185" rx="3" fill="rgba(235,108,54,0.18)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="552" y="205" class="val-accent">0.5777</text>

      <!-- Dashed Delta Drop Bracket (Clear of both numbers) -->
      <path d="M 512 170 L 552 170 L 552 192" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="3,3"/>
      <rect x="494" y="124" width="52" height="16" rx="3" fill="#f5f5f5" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="520" y="135.5" class="delta-text" fill="#eb6c36" font-weight="600">Δ -0.1424</text>
      <!-- Connector down from badge to bracket -->
      <line x1="520" y1="140" x2="520" y2="170" stroke="#eb6c36" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Group 2 Labels -->
      <text x="520" y="426" class="group-title" fill="#eb6c36">TF-IDF (Produksi)</text>
      <text x="520" y="442" class="group-sub" fill="#eb6c36">Model Terpilih · Generalisasi Jujur</text>


      <!-- ================= GROUP 3: INDOBERT ================= -->
      <!-- Background container -->
      <rect x="720" y="36" width="144" height="364" rx="6" fill="rgba(45,49,66,0.02)"/>

      <!-- Top Tag Badge -->
      <rect x="740" y="44" width="104" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="792" y="56" class="tag-text" fill="#7a8399">DITOLAK (UNDERFIT)</text>

      <!-- Bar Silver: 0.5247 (Arsir, h=168, y=232, w=48) -->
      <rect x="736" y="232" width="48" height="168" rx="3" fill="#f5f5f5"/>
      <rect x="736" y="232" width="48" height="168" rx="3" fill="url(#hatch-silver)"/>
      <rect x="736" y="232" width="48" height="168" rx="3" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="760" y="222" class="val-label" fill="#4f5d75">0.5247</text>

      <!-- Bar Gold: 0.4254 (Solid, h=136, y=264, w=48) -->
      <rect x="800" y="264" width="48" height="136" rx="3" fill="#f5f5f5"/>
      <rect x="800" y="264" width="48" height="136" rx="3" fill="rgba(45,49,66,0.22)" stroke="#2d3142" stroke-width="1.2"/>
      <text x="824" y="254" class="val-label" fill="#2d3142">0.4254</text>

      <!-- Dashed Delta Drop Bracket (Clear of both numbers) -->
      <path d="M 784 232 L 824 232 L 824 242" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="766" y="186" width="52" height="16" rx="3" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="792" y="197.5" class="delta-text" fill="#4f5d75">Δ -0.0993</text>
      <!-- Connector down from badge to bracket -->
      <line x1="792" y1="202" x2="792" y2="232" stroke="#7a8399" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Group 3 Labels -->
      <text x="792" y="426" class="group-title">IndoBERT (124,5M)</text>
      <text x="792" y="442" class="group-sub">Kompleksitas Tidak Optimal</text>


      <!-- ================= LEGEND STRIP ================= -->
      <line x1="24" y1="472" x2="976" y2="472" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="495" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="88" y="486" width="16" height="10" rx="2" fill="#f5f5f5"/>
      <rect x="88" y="486" width="16" height="10" rx="2" fill="url(#hatch-silver)"/>
      <rect x="88" y="486" width="16" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="112" y="495" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Silver Test (Garis Arsir · 202 ulasan)</text>

      <rect x="340" y="486" width="16" height="10" rx="2" fill="rgba(45,49,66,0.22)" stroke="#2d3142" stroke-width="1.2"/>
      <text x="364" y="495" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gold-v1 Human Benchmark (1.320 ulasan)</text>

      <rect x="624" y="486" width="16" height="10" rx="2" fill="rgba(235,108,54,0.18)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="648" y="495" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gold-v1 Model Produksi Terpilih (TF-IDF)</text>
    </svg>
  </div>
</body>
</html>
