experiment_version: "silver-baselines-1.0.0"
seed: 42
task: multilabel_aspect_detection
reference_label_type: ai_assisted_weak_supervision_silver

baselines:
  keyword: true
  tfidf:
    word_ngram_range: [1, 2]
    char_ngram_range: [3, 5]
    char_analyzer: char_wb
    min_df: 2
    max_features_word: 30000
    max_features_char: 40000
    representations: [word, char, word_char]
    c_values: [1.0]
    class_weight: balanced
    max_iter: 2000

indobert:
  output_version: "indobert-silver-v1"
  model_id: "indobenchmark/indobert-base-p1"
  revision: "c2cd0b51ddce6580eb35263b39b0a1e5fb0a39e2"
  license: "MIT"
  parameter_count: 124500000
  tokenizer: "BertTokenizer (WordPiece)"
  max_length: 192
  max_length_basis: "Confirm with tokenizer report; word EDA train+validation p95=103, p99=210."
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 0.00002
  weight_decay: 0.01
  epochs: 4
  warmup_ratio: 0.10
  early_stopping_patience: 2
  mixed_precision: fp16
  aspect_loss: weighted_bce
  classification_loss: weighted_cross_entropy
  severity_min_train_per_class: 20
  severity_min_validation_per_class: 5

thresholds:
  tune_per_label_on_validation: true
  default_detection: 0.50
  candidates: [0.25, 0.35, 0.45, 0.50, 0.55, 0.65, 0.75]
  prioritize_alert_precision: true

calibration:
  version: "aspect-calibration-v1"
  output_version: "indobert-evaluation-v1"
  method: deterministic_bounded_temperature_grid
  temperature_min: 0.5
  temperature_max: 5.0
  temperature_grid_size: 181
  ece_bins: 10
  threshold_candidates: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  alert_minimum_precision: 0.80
  alert_minimum_predictions: 5
